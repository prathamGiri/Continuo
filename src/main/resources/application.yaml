spring:
  application:
    name: taskmanager
  profiles:
    active: local

  datasource:
    url: "jdbc:postgresql://${DB_IP}:${DB_PORT}/taskmanager"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
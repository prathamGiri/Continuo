name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend - build and test
    runs-on: ubuntu-latest
    services:
      # Needed by the @SpringBootTest context-load test
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_IP: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Throwaway key used only by the test run
      JWT_SECRET: Y2ktb25seS10ZXN0LXNlY3JldC1ub3QtZm9yLXByb2R1Y3Rpb24hIQ==
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify

  email-worker:
    name: Email worker - build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -f email-worker/pom.xml verify

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, email-worker]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          JWT_SECRET: Y2ktb25seS10ZXN0LXNlY3JldC1ub3QtZm9yLXByb2R1Y3Rpb24hIQ==
